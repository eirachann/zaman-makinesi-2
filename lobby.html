<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zaman Makinesi - Lobi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(ellipse at top, #3d2a4a 0%, #2a1f3d 35%, #1a1424 75%, #120d1a 100%);
            color: #f3ede7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 15px;
            overflow-x: hidden;
        }

        .kutu {
            background: rgba(255, 240, 225, 0.045);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 220, 200, 0.12);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin-top: 10px;
        }

        .lobby-header {
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .lobby-header h1 {
            font-size: 1.5rem;
            color: #f3f4f6;
            margin-bottom: 5px;
        }

        .lobby-header p {
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .section-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: center;
        }

        .section-box label, .section-box h3 {
            font-size: 0.9rem;
            color: #a78bfa;
            font-weight: 600;
        }

        .room-code-display {
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
            background: rgba(139, 92, 246, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed rgba(139, 92, 246, 0.4);
        }

        .player-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
        }

        .oyuncu {
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .kick-btn {
            width: auto;
            margin: 0;
            padding: 4px 8px;
            font-size: 0.7rem;
            border-radius: 6px;
            background: rgba(220, 38, 38, 0.25);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #fca5a5;
        }

        .kick-btn:hover {
            background: rgba(220, 38, 38, 0.4);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #e5e7eb;
            font-weight: 400;
            text-align: left;
            cursor: pointer;
        }

        .checkbox-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #7c3aed;
            cursor: pointer;
        }

        select, button {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        select {
            background: rgba(20, 10, 35, 0.9);
            border: 1px solid rgba(139, 92, 246, 0.4);
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e5e7eb;
        }
    </style>
</head>
<body>

    <div class="kutu">
        <div class="lobby-header">
            <h1>🕰️ Zaman Makinesi</h1>
            <p>Oyuncular katıldıktan sonra yönetici oyunu başlatabilir.</p>
        </div>

        <div class="section-box">
            <label>Oda Kodu</label>
            <div class="room-code-display" id="odaKodu">-</div>
            <button class="secondary" id="kopyala">📋 Oda Kodunu Kopyala</button>
        </div>

        <div class="section-box">
            <h3>Oyuncular</h3>
            <div class="player-list" id="oyuncular">
                <div class="oyuncu">Yükleniyor...</div>
            </div>
        </div>

        <div class="section-box" id="hostAyarlar" style="display: none;">
            <label for="mod">🎮 Oyun Modu</label>
            <select id="mod">
                <option value="klasik">Klasik</option>
                <option value="kirik_zaman">🌀 Kırık Zaman Makinesi</option>
                <option value="zaman_sapmasi">⚠️ Zaman Sapması</option>
                <option value="gecmis_gelecek">🔮 Geçmiş Günler Gelecek</option>
            </select>

            <label style="margin-top: 8px;">✨ Ek Özellikler (isteğe bağlı)</label>
            <label class="checkbox-row">
                <input type="checkbox" id="ticaretCheck">
                🎒 Boyutlar Arası Ticaret (Eşya Takası)
            </label>
            <label class="checkbox-row">
                <input type="checkbox" id="sabotajciCheck">
                🕵️ Sabotajcı
            </label>
        </div>

        <div id="islemButonlari">
            <button id="baslat" style="display: none;">Oyunu Başlat</button>
        </div>
    </div>

    <script type="module" src="./lobby.js"></script>
</body>
</html>
